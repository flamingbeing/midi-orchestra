name: Render new pieces
# Drop a MIDI file into inbox/ -> a piece folder with draft 1 and a listening page.
on:
  push:
    branches: [main]
    paths: ['inbox/*.mid', 'inbox/*.midi', 'inbox/*.MID', 'inbox/*.MIDI']
  workflow_dispatch:
concurrency: { group: render, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -q -r pipeline/requirements.txt
      - name: Render every MIDI in inbox/
        id: ingest
        env: { PY: python, WORK: /tmp/midi-orchestra-work }
        run: |
          pieces=$(pipeline/tools/ingest_inbox.sh)
          echo "pieces<<EOF" >> "$GITHUB_OUTPUT"; echo "$pieces" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          { echo "### Rendered"; echo "$pieces" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the new pieces
        if: steps.ingest.outputs.pieces != ''
        env: { PIECES: '${{ steps.ingest.outputs.pieces }}' }
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render draft 1: $(echo "$PIECES" | paste -sd ',' | sed 's/,/, /g')"
          git pull --rebase -q origin main && git push origin HEAD:main
